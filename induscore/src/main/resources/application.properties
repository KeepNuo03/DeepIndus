spring.application.name=induscore
server.port=8000

app.jwt.secret=induscore-dev-secret-change-me-32bytes-min
app.jwt.expirationSeconds=7200

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/induscore?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123456}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.flyway.enabled=false
spring.flyway.baseline-on-migrate=true
# 允许乱序迁移，不验证迁移历史（开发环境）
spring.flyway.out-of-order=true
spring.flyway.validate-on-migrate=false

yolo.service.url=${YOLO_URL:http://localhost:8001}
yolo.service.timeoutMs=${YOLO_TIMEOUT_MS:30000}
detection.realtime.modelVersion=YOLOv8-Industrial
# 视频流检测轮询间隔（毫秒），仅当有摄像头 start 时生效
detection.realtime.intervalMs=${DETECTION_REALTIME_INTERVAL_MS:5000}

file.export.path=${EXPORT_PATH:./data/exports/}
file.export.base-url=${EXPORT_BASE_URL:http://localhost:8000/files/}

mobile.auth.allowed-client-types=${MOBILE_ALLOWED_CLIENT_TYPES:android,mobile}
mobile.auth.allowed-roles=${MOBILE_ALLOWED_ROLES:super_admin,admin,production_manager,qc_inspector}
mobile.upload.state-ttl-minutes=${MOBILE_UPLOAD_STATE_TTL_MINUTES:1440}
mobile.upload.cleanup-interval-ms=${MOBILE_UPLOAD_CLEANUP_INTERVAL_MS:300000}
mobile.pilot.line-name=${MOBILE_PILOT_LINE_NAME:A-01}
mobile.pilot.target.close-loop-rate=${MOBILE_TARGET_CLOSE_LOOP_RATE:95}
mobile.pilot.target.upload-recovery-rate=${MOBILE_TARGET_UPLOAD_RECOVERY_RATE:99}
mobile.pilot.target.api-p95-latency-ms=${MOBILE_TARGET_API_P95_LATENCY_MS:500}

agent.model.enabled=${AGENT_MODEL_ENABLED:false}
agent.model.provider=${AGENT_MODEL_PROVIDER:openai}
agent.model.api-key=${AGENT_MODEL_API_KEY:}
agent.model.base-url=${AGENT_MODEL_BASE_URL:https://api.openai.com/v1}
agent.model.name=${AGENT_MODEL_NAME:gpt-4o-mini}
agent.model.temperature=${AGENT_MODEL_TEMPERATURE:0.2}
agent.model.timeout-ms=${AGENT_MODEL_TIMEOUT_MS:12000}
agent.model.retry.enabled=${AGENT_MODEL_RETRY_ENABLED:true}
agent.model.retry.max-attempts=${AGENT_MODEL_RETRY_MAX_ATTEMPTS:3}
agent.model.retry.initial-backoff-ms=${AGENT_MODEL_RETRY_INITIAL_BACKOFF_MS:800}
agent.model.retry.max-backoff-ms=${AGENT_MODEL_RETRY_MAX_BACKOFF_MS:5000}
agent.model.fallback.enabled=${AGENT_MODEL_FALLBACK_ENABLED:false}
agent.model.fallback.api-key=${AGENT_MODEL_FALLBACK_API_KEY:}
agent.model.fallback.base-url=${AGENT_MODEL_FALLBACK_BASE_URL:}
agent.model.fallback.name=${AGENT_MODEL_FALLBACK_NAME:}

# Agent 会话容量治理
agent.chat.max-concurrent-per-user=${AGENT_CHAT_MAX_CONCURRENT_PER_USER:1}
agent.chat.context-window-messages=${AGENT_CHAT_CONTEXT_WINDOW_MESSAGES:24}
agent.chat.max-message-chars=${AGENT_CHAT_MAX_MESSAGE_CHARS:8000}
agent.chat.session-detail-default-page-size=${AGENT_CHAT_SESSION_DETAIL_DEFAULT_PAGE_SIZE:50}
agent.chat.session-detail-max-page-size=${AGENT_CHAT_SESSION_DETAIL_MAX_PAGE_SIZE:200}
agent.chat.summary.enabled=${AGENT_CHAT_SUMMARY_ENABLED:true}
agent.chat.summary.trigger-messages=${AGENT_CHAT_SUMMARY_TRIGGER_MESSAGES:30}
agent.chat.summary.recent-keep-messages=${AGENT_CHAT_SUMMARY_RECENT_KEEP_MESSAGES:12}
agent.chat.summary.max-chars=${AGENT_CHAT_SUMMARY_MAX_CHARS:1200}
agent.chat.summary.source-max-messages=${AGENT_CHAT_SUMMARY_SOURCE_MAX_MESSAGES:120}
agent.chat.retention-cleanup.enabled=${AGENT_CHAT_RETENTION_CLEANUP_ENABLED:false}
agent.chat.retention-days=${AGENT_CHAT_RETENTION_DAYS:180}
agent.chat.retention-cleanup.cron=${AGENT_CHAT_RETENTION_CLEANUP_CRON:0 0 4 * * ?}
